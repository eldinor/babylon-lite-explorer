<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../example-nav.css" />
    <title>Configurable container — Babylon Lite Explorer</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 60px 24px 24px; background: #111318; color: #edf1f7; }
      .intro { width: min(1120px, 100%); margin: 0 auto 16px; color: #aab4c3; line-height: 1.5; }
      #workspace { width: min(1120px, 100%); height: min(720px, calc(100vh - 130px)); min-height: 560px; margin: 0 auto; overflow: hidden; border: 1px solid #303744; border-radius: 14px; background: #191d24; }
      #canvas-column { width: calc(100% - 420px); min-width: 420px; padding: 18px; }
      #canvas-frame { width: 100%; aspect-ratio: 1; overflow: hidden; border-radius: 10px; background: #080b10; }
      #renderCanvas { display: block; width: 100%; height: 100%; }
      #mountStatus { display: block; margin-top: 10px; color: #71b7ff; font-size: 13px; }
      @media (max-width: 860px) { #workspace { width: 860px; } #canvas-column { width: 440px; min-width: 440px; } }
    </style>
  </head>
  <body>
    <a class="example-home-link" href="../">&larr; All examples</a>
    <p class="intro">The canvas is constrained to a square two levels below <code>#workspace</code>. Explorer receives <code>container: workspace</code>, allowing its overlay to use the free area beside the canvas.</p>
    <main id="workspace">
      <section id="canvas-column">
        <div id="canvas-frame"><canvas id="renderCanvas"></canvas></div>
        <output id="mountStatus">Explorer state: visible</output>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
